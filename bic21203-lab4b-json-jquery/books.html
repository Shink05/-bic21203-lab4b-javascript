<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q2 - Retrieve and Display JSON Data</title>
</head>
<body>
  <h1>Book Data (from books.json)</h1>
  <p id="status" role="status" aria-live="polite">Loading...</p>
  <section id="output"></section>

  <script>
    const status = document.getElementById("status");
    const output = document.getElementById("output");

    // Helper: create an element with safe text content
    function addElement(parent, tag, text) {
      const el = document.createElement(tag);
      el.textContent = text;
      parent.appendChild(el);
      return el;
    }

    async function loadBooks() {
      try {
        const response = await fetch("books.json");
        if (!response.ok) {
          throw new Error("HTTP error " + response.status);
        }
        const data = await response.json(); // throws if JSON is invalid
        const books = data.books;

        status.textContent = "";

        // (a) Title of the first book
        addElement(output, "p", "Title of the first book: " + books[0].title);

        // (b) Author of the second book
        addElement(output, "p", "Author of the second book: " + books[1].author);

        // (c) Genres of both books, grouped by book title
        addElement(output, "h2", "Genres");
        const list = addElement(output, "ul", "");
        for (const book of books) {
          addElement(list, "li", book.title + " \u2014 " + book.genres.join(", "));
        }
      } catch (error) {
        console.error(error);
        status.textContent = "Sorry, the book data could not be loaded. Please try again later.";
      }
    }

    loadBooks();
  </script>
</body>
</html>
